name: System Sync & Diagnostics

on:
  schedule:
    - cron: '5 2 * * *' # 02:05 AM UTC (~22:05 / 23:05 hora de Chile)
  workflow_dispatch:

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p datos_privados
          curl -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/${{ github.repository }}/traffic/clones \
               > datos_privados/metrics_data.json

      - name: Archive Internal Logs
        uses: actions/upload-artifact@v4
        with:
          name: sys-diag-data
          path: datos_privados/metrics_data.json
          retention-days: 30
