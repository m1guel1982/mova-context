- name: Merge & Accumulate Telemetry
        env:
          GH_TOKEN: ${{ secrets.METRICS_PAT }}
          TARGET_URL: ${{ secrets.DIAGNOSTIC_ENDPOINT }}
        run: |
          mkdir -p .github/metrics

          # Usar -f para que falle la Action si la API devuelve 401, 404, etc.
          curl -f -s -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "$TARGET_URL" > temp_metrics.json

          python - << 'EOF'
          import json
          import os

          history_file = '.github/metrics/clones_history.json'
          temp_file = 'temp_metrics.json'

          if os.path.exists(history_file):
              try:
                  with open(history_file, 'r') as f:
                      history = json.load(f)
              except Exception:
                  history = {"total_clones": 0, "total_uniques": 0, "clones": {}}
          else:
              history = {"total_clones": 0, "total_uniques": 0, "clones": {}}

          if "clones" not in history or isinstance(history["clones"], list):
              history["clones"] = {}

          with open(temp_file, 'r') as f:
              api_data = json.load(f)

          clones_data = api_data.get('clones', [])

          # Soporte tanto para lista (API oficial) como para diccionario
          if isinstance(clones_data, list):
              for entry in clones_data:
                  date_key = entry['timestamp'].split('T')[0]
                  history['clones'][date_key] = {
                      "count": entry.get('count', 0),
                      "uniques": entry.get('uniques', 0)
                  }
          elif isinstance(clones_data, dict):
              for date_key, metrics in clones_data.items():
                  history['clones'][date_key] = metrics

          # Recalcular totales acumulados
          total_count = sum(day['count'] for day in history['clones'].values())
          total_uniques = sum(day['uniques'] for day in history['clones'].values())

          history['total_clones'] = total_count
          history['total_uniques'] = total_uniques

          with open(history_file, 'w') as f:
              json.dump(history, f, indent=2)

          EOF

          rm -f temp_metrics.json
